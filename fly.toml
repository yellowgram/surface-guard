# Surface Guard — Fly.io app config
# App name: surface-guard → https://surface-guard.fly.dev
# Secrets are set via `fly secrets set` (never commit them).
# See docs/OPERATOR_GO_LIVE.md and docs/HOSTING.md.

app = "surface-guard"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  # PORT is injected by Fly; app reads process.env.PORT (default 3080 in code).
  # Non-secret path defaults (override with secrets/env as needed):
  SURFACE_GUARD_LOCKFILE_PATH = "surfacepin.lock.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
